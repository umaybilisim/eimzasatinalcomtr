name: GitHub Pages'e Deploy Et

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: IndexNow — Bing & Yandex Bildirim
        # Sitemap'teki tüm URL'ler bildirilir; yeni sayfalar elle eklenmeden otomatik gönderilir.
        run: |
          sleep 30
          URLS=$(curl -s https://eimzasatinal.com.tr/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#<loc>\(.*\)</loc>#"\1"#' | paste -sd, -)
          if [ -z "$URLS" ]; then echo "Sitemap okunamadı"; exit 1; fi
          curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"eimzasatinal.com.tr\",\"key\":\"eimza2026indexnow4f8b3c1d5a9e7f2b\",\"keyLocation\":\"https://eimzasatinal.com.tr/eimza2026indexnow4f8b3c1d5a9e7f2b.txt\",\"urlList\":[$URLS]}"
